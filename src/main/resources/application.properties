spring.application.name=offlinepayment-relay

spring.datasource.url=jdbc:h2:file:./data/offlinepayment-relay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-before-any-real-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
