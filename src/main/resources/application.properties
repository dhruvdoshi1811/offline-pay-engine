spring.application.name=offlinepayment-relay
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:h2:file:./data/offlinepayment-relay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-before-any-real-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.packet.freshness-window-minutes=${PACKET_FRESHNESS_WINDOW_MINUTES:5}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.admin.email=${ADMIN_EMAIL:admin@demo.local}
app.admin.password=${ADMIN_PASSWORD:change-me-admin}
