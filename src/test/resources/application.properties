spring.application.name=offlinepayment-relay

spring.datasource.url=jdbc:h2:mem:offlinepayment-relay-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=test-only-secret-key-not-used-outside-of-tests-ever
app.jwt.expiration-ms=3600000
